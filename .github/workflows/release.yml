name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to (e.g. 2.2-Vega)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  upload-zip:
    name: Upload extension zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Build zip (manifest.json at the archive root)
        run: |
          ZIP="Parsec-${TAG}.zip"
          (cd PARSEC && zip -r -X -9 "../${ZIP}" . -x '.*' '*/.*')
          unzip -l "$ZIP" | grep -q ' manifest.json$'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
